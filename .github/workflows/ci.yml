name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score SAM 3.1 against the hand labels
        run: python eval/score.py
      - name: The published numbers match the labels
        run: git diff --exit-code eval/results.json web/src/content/eval.json

  fresh-build:
    name: Fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Every sample survey opens with its dogs
        run: node --test tests/smoke-local.test.mjs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t seventy .
      - run: docker run -d --name seventy -p 3000:3000 seventy
      - name: Every sample survey opens with its dogs
        run: node --test tests/smoke-local.test.mjs
        env:
          SEVENTY_URL: http://localhost:3000
